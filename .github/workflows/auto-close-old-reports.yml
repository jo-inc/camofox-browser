name: Auto-close old version reports

on:
  issues:
    types: [opened]

jobs:
  check-version:
    if: contains(join(github.event.issue.labels.*.name, ','), 'auto-report')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check reporter version
        uses: actions/github-script@v7
        with:
          script: |
            const MIN_VERSION = [1, 10, 0];
            const body = context.payload.issue.body || '';

            // Parse "- **version:** X.Y.Z" from issue body
            const match = body.match(/\*\*[Vv]ersion:\*\*\s*v?(\d+\.\d+\.\d+)/);
            if (!match) {
              console.log('No version found in issue body, closing.');
            } else {
              const parts = match[1].split('.').map(Number);
              let dominated = false;
              for (let i = 0; i < MIN_VERSION.length; i++) {
                if ((parts[i] || 0) > MIN_VERSION[i]) { dominated = false; break; }
                if ((parts[i] || 0) < MIN_VERSION[i]) { dominated = true; break; }
              }
              if (!dominated) {
                console.log(`Version ${match[1]} meets minimum ${MIN_VERSION.join('.')}.`);

                const labels = context.payload.issue.labels.map(l => l.name);

                // Auto-close likely-sleep issues (CPU ratio near zero = OS suspend, not real stall)
                if (labels.includes('likely-sleep')) {
                  console.log('likely-sleep label detected, closing.');
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: 'Closing — classified as OS sleep/suspend (CPU/wall ratio near zero).',
                  });
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    state: 'closed',
                    state_reason: 'not_planned',
                  });
                  return;
                }

                // Auto-close stalls with no active tabs (no user work affected)
                if (labels.includes('stuck')) {
                  const tabMatch = body.match(/\*\*active tabs:\*\*\s*(\d+)/);
                  if (tabMatch && parseInt(tabMatch[1], 10) === 0) {
                    console.log('Stall with 0 active tabs, closing.');
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: 'Closing — event loop stall with no active tabs (no user work affected). If you hit this during active browsing, please re-open.',
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      state: 'closed',
                      state_reason: 'not_planned',
                    });
                    return;
                  }
                }

                // Auto-close memory leaks where growth is within expected operational limits
                // (e.g. active browsing sessions allocate up to 800MB of CDP stream buffers and DOM,
                // and idle sessions reclaim memory via self-healing restart).
                if (labels.includes('memory-leak')) {
                  const growthMatch = body.match(/growth(?:Mb)?:\s*(\d+)/i) || body.match(/Native memory grew by\s*(\d+)MB/i);
                  const growthMb = growthMatch ? parseInt(growthMatch[1], 10) : null;
                  const ctxMatch = body.match(/\*\*browser contexts:\*\*\s*(\d+)/);
                  const tabMatch = body.match(/\*\*active tabs:\*\*\s*(\d+)/);
                  const sessionsMatch = body.match(/"sessions":\s*(\d+)/);
                  const activeSessions = ctxMatch ? parseInt(ctxMatch[1], 10) : (sessionsMatch ? parseInt(sessionsMatch[1], 10) : 0);

                  // Active browsing sessions legitimately allocate up to 800MB of temporary CDP buffers.
                  // Idle sessions (< 400MB) are within normal allocator drift / handled by restart.
                  const maxAllowedGrowth = activeSessions > 0 ? 800 : 400;

                  if (growthMb !== null && growthMb < maxAllowedGrowth) {
                    console.log(`Memory leak growth ${growthMb}MB is below ${maxAllowedGrowth}MB threshold (activeSessions=${activeSessions}), closing.`);
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: `Closing — native memory growth of ${growthMb}MB is within expected operational limits (${activeSessions > 0 ? 'active browsing sessions allocate up to 800MB of temporary CDP buffers and DOM structures' : 'idle allocator fragmentation accounts for growth up to 400MB'}). Memory is reclaimed when tabs close or the browser restarts on idle. If you experience unbounded growth exceeding ${maxAllowedGrowth}MB or OOM crashes, please re-open.`,
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      state: 'closed',
                      state_reason: 'not_planned',
                    });
                    return;
                  }

                  const isIdle = activeSessions === 0 && (!tabMatch || parseInt(tabMatch[1], 10) === 0);
                  if (isIdle) {
                    console.log('Memory leak with 0 contexts/sessions, closing (self-healing).');
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: 'Closing — native memory growth detected with no active sessions. The memory pressure restart mechanism automatically reclaims this when idle. This is expected Firefox/Playwright behavior (jemalloc fragmentation, CDP buffers). If you experience OOM crashes during active use, please re-open.',
                    });
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      state: 'closed',
                      state_reason: 'not_planned',
                    });
                    return;
                  }
                }

                console.log('Keeping open.');
                return;
              }
              console.log(`Version ${match[1]} below minimum ${MIN_VERSION.join('.')}, closing.`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Closing — reported from v${match ? match[1] : 'unknown'}, minimum supported is v${MIN_VERSION.join('.')}. Please upgrade to get improved crash diagnostics.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });
