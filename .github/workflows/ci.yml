name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (TypeScript → JS)
        run: npm run build

      - name: Verify standalone MCP package
        run: npm run test:mcp

      - name: Audit standalone MCP package
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm audit --prefix mcp --omit=dev

      - name: Run unit + plugin tests (Jest)
        run: |
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPatterns='tests/unit|plugins' \
            --testPathIgnorePatterns='security\.test|tabRecycling\.test|cookies\.test|timeoutContinuation\.test|operationalFailures\.test|tabLifecycleContract\.test' \
            --forceExit
        env:
          CI: true


  windows-process-cleanup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Install Camoufox
        run: npm run fetch-bin

      - name: Verify Windows process cleanup
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = '--experimental-vm-modules'
          npx jest --runInBand --forceExit tests/unit/windowsProcesses.test.js
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Run e2e + browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --config jest.config.e2e.cjs \
              --runInBand --forceExit
        env:
          CI: true

      - name: Run browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/unit/(security|tabRecycling|cookies|timeoutContinuation|operationalFailures|tabLifecycleContract)\.test' \
              --runInBand --forceExit
        env:
          CI: true

  windows-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Install Camoufox
        run: npm run fetch-bin

      - name: Run browser E2E tests
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = '--experimental-vm-modules'
          npx jest --config jest.config.e2e.cjs --runInBand --forceExit
        env:
          CI: true

  notify-agenthook:
    needs: [unit, windows-process-cleanup, e2e, windows-e2e]
    if: always()
    uses: ./.github/workflows/agenthook-notify.yml
    with:
      kind: ci
      results: ${{ toJson(needs) }}
    secrets: inherit
